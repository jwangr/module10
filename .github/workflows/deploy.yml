name: Deploy Static Vite React Site to GitHub Pages

on:
  push:
    branches:
      - "10.2"

permissions:
  contents: write  # Needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ✅ Go into the correct project folder
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: lab-module6
        run: npm ci

      - name: Build Vite site
        working-directory: lab-module6
        run: npm run build

      # ✅ Deploy the built site from the dist folder
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: lab-module6/dist